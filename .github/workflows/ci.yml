# 每次 push 和 PR 都跑。不需要任何 secret，所以 fork 來的 PR 也能跑。
name: CI

on:
  push:
  pull_request:

# 同一個分支連續 push 時，取消還在跑的舊 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # vue-tsc。這是前端唯一的自動檢查，repo 目前沒有測試。
      - run: npm run type-check
      # build 不帶 VITE_API_BASE，確認模擬資料模式也能產出。
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      # 沒有 TDX 金鑰也必須能 import 並建立 app：服務是設計成「沒金鑰照樣啟動，
      # 資料端點回 503」，CI 這一步就是在守住那個行為。
      - run: python -c "from app.main import app; assert any(r.path == '/health' for r in app.routes)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cloud Run 跑的就是這個 image，所以 build 不過就等於部署會失敗。
      - run: docker build -t bus-assist-api:ci backend
